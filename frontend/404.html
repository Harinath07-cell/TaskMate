<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 Page Not Found - TaskMate">
  <title>404 Page Not Found — TaskMate</title>
  
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo" id="nav-brand">
        <img src="/assets/logo.svg" alt="TaskMate Logo" width="34" height="34">
        <span>Task<span>Mate</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/faq" class="nav-link">FAQ</a></li>
        <li><a href="/errors" class="nav-link">Error Guide</a></li>
        <li><a href="/about" class="nav-link">About</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn btn-outline btn-sm" onclick="window.TaskMateChat && window.TaskMateChat.open()">
          🤖 AI Assistant
        </button>
      </div>
    </div>
  </header>

  <!-- Error Card Main Section -->
  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem;">
    <div class="card" style="max-width: 560px; text-align: center; padding: 3rem 2rem;">
      <div style="font-size: 4rem; line-height: 1; margin-bottom: 1rem;">🔍</div>
      <span class="badge badge-medium" style="font-size: 0.9rem; padding: 0.35rem 0.85rem; margin-bottom: 1rem;">
        HTTP 404 ERROR
      </span>
      <h1 style="font-size: 2.25rem; margin-bottom: 1rem;">Page Not Found</h1>
      <p style="font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
        We couldn't find the page you requested. Check the address or ask the TaskMate assistant for help.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary" id="btn-return-home">
          ← Return to Dashboard
        </a>
        <button class="btn btn-secondary" onclick="askAbout404()" id="btn-ask-assistant-404">
          Ask the Assistant
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div>
        <p style="margin: 0; font-weight: 600; color: var(--text-primary);">TaskMate — AI-Powered Task Manager</p>
      </div>
      <div style="display: flex; gap: 1.25rem; font-size: 0.85rem;">
        <a href="/">Home</a>
        <a href="/faq">FAQ</a>
        <a href="/errors">Error Guide</a>
        <a href="/about">About</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    function askAbout404() {
      if (window.TaskMateChat) {
        window.TaskMateChat.open();
        window.TaskMateChat.sendMessage("I encountered a 404 Page Not Found error. How can I resolve it?");
      }
    }
  </script>
</body>
</html>
